# DAD as a Docker Compose stack: the application in its own containers, the
# database in a separate PostgreSQL container.
#
#   docker compose up --build          # migrate, then web + importer + scheduler + syslog
#   docker compose --profile test run --build --rm test   # the suite, on Postgres
#
# Why the app is split into separate services rather than one container: these
# are independent long-lived processes with different lifetimes and failure
# modes, and the repo already ships a systemd unit for each. Compose maps
# one-to-one onto that topology, so the container set is the same architecture
# production runs -- not one container running three things under a supervisor,
# which would hide exactly the coupling the units exist to fix.
#
#   db        PostgreSQL 17 -- the only thing that holds data
#   migrate   one-shot: builds the schema, then exits
#   web       Rails (rails server, port 3000)
#   importer  import_syslog.rb  -- Logs/LogsToProcess -> database
#   scheduler scheduler.rb      -- runs Jobs whose next_run has passed
#   syslog    syslog_collector  -- UDP/514 -> Logs/LogStaging
#   windows   import_windows_events.rb -- OpenWEC output -> LogsToProcess (profile: windows)
#   test      rake test + cucumber, against the db container (profile: test)
#
# Every service except syslog ships its own stdout/stderr to the syslog service,
# so the stack watches itself: a Rails stack trace or a Postgres checkpoint
# becomes an ordinary DAD event. See x-app-logging below for the format choice
# and why it is not the driver default.
#
# Production deploys via systemd + your own web server (see systemd/README.md);
# this
# stack is the development and test path.

# Container self-logging, applied to every service but syslog itself, which must
# never be tagged. In steady state the collector logs almost nothing, so tagging
# it looks harmless -- but with DAD_SYSLOG_DEBUG=1 it echoes every record it
# writes to stdout, the driver sends that straight back to the same socket, and
# the loop is unbounded: measured at 5.7GB -> 13.9GB in 20 seconds (~411MB/s)
# before the container was killed. CI asserts the exemption
# (.github/workflows/ci.yml). Each service overrides only `tag`, which is what
# DAD parses as the event's Service (see below), so the blocks stay one line each.
#
# No syslog-format is set, and that is deliberate. Measured on Docker 29 over UDP,
# the default frame is RFC 3164 with the HOSTNAME slot left out:
#
#   <30>Nov 12 16:38:21 dad-web[149784]: Started GET /users/logon
#
# EventIngestor takes the token after the timestamp as the Service, so `dad-web`
# becomes the Service and each container gets its own row. Setting
# `syslog-format: rfc3164` explicitly inserts the *Docker host's* hostname in that
# slot instead, and the Service sanitizer strips digits, so a host named
# `67ec82500e20` yields the Service `ece` for every container. Setting rfc5424 is
# worse still: it puts a version number and an ISO-8601 timestamp where DAD expects
# the timestamp, so every line fails to parse and nothing is stored at all -- the
# queue fills and the dashboard stays empty.
#
# Relying on the driver default is guarded by the CI step "Assert the stack's own
# logs reach the database", which asserts the Service name, not just that a row
# appeared. If a future Docker changes the default, that step goes red instead of
# the ingest path silently stopping.
#
# The port is interpolated from DAD_SYSLOG_PORT (default 514) in two places -- here
# and the collector's published port below -- so target and mapping cannot drift
# apart. Host already holding 514? `DAD_SYSLOG_PORT=1514 docker compose up` moves
# both. A YAML anchor cannot carry it: anchors substitute whole nodes, not part of
# a string.
#
# The address is the host's loopback, reaching the collector through its published
# port. It cannot be the compose service name: the log driver resolves
# syslog-address in the *daemon's* namespace, not the container's, so
# `udp://syslog:514` fails with "lookup syslog on 127.0.0.11:53: server misbehaving"
# and the container never starts. An IP needs no DNS at all.
x-app-logging: &app-logging
  driver: syslog
  options: &app-logging-options
    syslog-address: "udp://127.0.0.1:${DAD_SYSLOG_PORT:-514}"

# Shared by web/importer/scheduler/migrate/test: same image, same environment,
# different command. A top-level `x-` key, so Compose treats it as an extension
# and never starts it as a service of its own -- a plain `app:` service here would
# boot an idle container running the image's default CMD.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment:
    # RAILS_ENV=development, not production. Production sets
    # config.public_file_server.enabled = false and assets.compile = false, i.e.
    # it assumes Apache serves public/assets. There is no Apache in this stack,
    # so a production-mode web container boots fine and 404s every stylesheet and
    # script. Development mode is the honest match for `rails server`.
    RAILS_ENV: development
    DATABASE_URL: postgresql://dad:dad@db:5432/dad_development
  depends_on:
    db:
      condition: service_healthy
  # No code bind mount. The image runs as uid 1000; bind-mounting a checkout
  # owned by any other uid makes Rails' log/ and tmp/ writes fail with EACCES in
  # ways that read like an app bug. The gem layer is cached, so an edit plus
  # `up --build` only re-runs `COPY . .` and takes seconds.
  #
  # One volume for the whole Logs tree: the importer chdirs into Logs/LogsToProcess
  # and moves finished files to ../ProcessedLogs, so staging, queue and processed
  # must sit under a single mount and stay consistent with each other.
  volumes:
    - logs:/var/DAD/Logs
  restart: unless-stopped

services:
  db:
    # Pinned to a major version, matching the Postgres the CI job uses. A bare
    # `postgres:latest` would move the engine under the suite with no code change
    # -- the same silent environment drift a floating runner image caused in CI.
    image: postgres:17
    # Postgres logs are the ones most worth having in DAD: checkpoints, slow
    # queries, and connection refusals otherwise only reach `docker compose logs`.
    #
    # Deliberately no `depends_on: syslog` here. The log driver dials UDP at
    # container start, so ordering would only win a few early lines -- and a hard
    # dependency makes a failed bind on the collector (host already holding 514)
    # take db down with it, which turns "one optional service is down" into
    # "nothing starts". Missing the first few lines is the better failure.
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-db
    environment:
      POSTGRES_USER: dad
      POSTGRES_PASSWORD: dad
      POSTGRES_DB: dad_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port. The app containers reach this over the compose network by
    # service name, so nothing needs a host mapping, and publishing 5432 by default
    # collides with a Postgres already running on the developer's machine --
    # `docker compose up` then fails with "address already in use" before any
    # container starts. Want psql from the host? Use the override:
    #   docker compose -f docker-compose.yml -f docker-compose.db-port.yml up
    healthcheck:
      # Every app service waits on this. `depends_on` alone only waits for the
      # container to start, not for the postmaster to accept connections, so
      # without a healthcheck the app services die on their first connect.
      test: ["CMD-SHELL", "pg_isready -U dad -d dad_development"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot, and the only thing allowed to change schema. Without it the app
  # services come up against an empty database and the importer crash-loops on
  # `relation "statistics" does not exist`.
  #
  # migrate_from_scratch on an empty database, not db:migrate: db/schema.rb is
  # committed in SQLite flavour, and db:migrate loads that dump into an empty
  # Postgres database and skips db/migrate entirely -- so the partitioned shape
  # production has would never be built. Once the schema exists it uses plain
  # db:migrate, because migrate_from_scratch drops and rebuilds everything.
  migrate:
    <<: *app
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-migrate
    # DAD_ADMIN_PASSWORD seeds the initial admin. db/seeds.rb raises rather than
    # inventing a well-known account, so without it the stack comes up with zero
    # users and the web UI is unreachable -- it renders a login form that can
    # never succeed. This default is a development convenience and is stated in
    # the README; production sets its own password.
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://dad:dad@db:5432/dad_development
      DAD_ADMIN_USER: admin
      DAD_ADMIN_PASSWORD: ${DAD_ADMIN_PASSWORD:-dad_dev_password}
    command:
      - bash
      - -c
      - |
        set -e
        bundle exec rake db:create
        if [ -z "$$(psql "$$DATABASE_URL" -tAc "select to_regclass('public.schema_migrations')")" ]; then
          echo "Empty database: building the Postgres schema from db/migrate."
          bundle exec rake db:migrate_from_scratch
        else
          bundle exec rake db:migrate
        fi
        # Seed only when there is no admin yet. db:seed is idempotent, but it also
        # seeds the maintenance Jobs, and re-running it on every start would
        # re-create any Job an operator had deleted.
        if [ "$$(psql "$$DATABASE_URL" -tAc "select count(*) from users")" = "0" ]; then
          echo "No users: seeding roles, rights and the admin account ($${DAD_ADMIN_USER})."
          bundle exec rake db:seed
        fi
    restart: "no"

  web:
    <<: *app
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-web
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  importer:
    <<: *app
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-importer
    command: ["bundle", "exec", "ruby", "import_syslog.rb"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional: converts OpenWEC (Windows event collector) output into DAD's
  # staging format and enqueues it. Off by default -- it needs an OpenWEC
  # installation writing an input file, which this stack does not provide.
  # Enable with: docker compose --profile windows up
  windows:
    <<: *app
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-windows
    profiles: ["windows"]
    environment:
      WINDOWS_INPUT: /var/DAD/Logs/Windows/openwec.log
      WINDOWS_STAGING: /var/DAD/Logs/WindowsStaging
      WINDOWS_QUEUE: /var/DAD/Logs/LogsToProcess
    command: ["bundle", "exec", "ruby", "import_windows_events.rb"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-scheduler
    command: ["bundle", "exec", "ruby", "scheduler.rb"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  syslog:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    # The collector is a standalone Rust binary and touches no database, so it
    # needs no DATABASE_URL -- same reasoning as the dad-syslog systemd unit
    # holding no EnvironmentFile. It does not use the <<: *app environment block,
    # which is why it declares build: directly instead of inheriting the anchor.
    volumes:
      - logs:/var/DAD/Logs
    ports:
      # UDP syslog intake, and the target of every container's own log stream
      # (see x-app-logging). If something on the host already holds 514, set
      # DAD_SYSLOG_PORT and both this mapping and the log drivers move together.
      #
      # Published on all interfaces, and the collector itself binds 0.0.0.0
      # (syslog_collector/src/runtime.rs). That is expected, not an oversight:
      # remote hosts sending logs is the primary use case, so restricting this to
      # loopback would break the deployment for anyone but the stack itself. UDP
      # syslog is unauthenticated by protocol, so the boundary is the network --
      # filter it at the firewall; do not narrow the bind.
      - "${DAD_SYSLOG_PORT:-514}:514/udp"
    command: ["syslog_collector"]
    restart: unless-stopped

  # The suite, against the engine production runs. Gated behind a profile so
  # `docker compose up` does not run tests.
  test:
    <<: *app
    logging:
      <<: *app-logging
      options:
        <<: *app-logging-options
        tag: dad-test
    profiles: ["test"]
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://dad:dad@db:5432/dad_test
    command:
      - bash
      - -c
      - |
        set -e
        # No `bundle install` here: the image already ran it, and /usr/local/bundle
        # is root-owned while the container runs as dad, so bundler fails writing
        # its config. The lockfile is enforced at build time by --frozen.
        bundle exec rake db:create db:migrate_from_scratch
        bundle exec rake test
        # `rake test` excludes test/system by design (Rails sets
        # DEFAULT_TEST_EXCLUDE to test/{system,dummy,fixtures}/**), so the
        # browser-level suite needs its own task or it never runs.
        bundle exec rake test:system
        bundle exec cucumber
        echo "--- asserting the Postgres-only schema shape ---"
        psql "$$DATABASE_URL" -tAc \
          "select count(*) from pg_class where relname in ('events','events_words') and relkind <> 'p'" \
          | grep -qx 0 || { echo "events/events_words must be partitioned on Postgres"; exit 1; }
        echo "--- asserting no INVALID index ---"
        invalid=$$(psql "$$DATABASE_URL" -tAc \
          "select c.relname from pg_class c join pg_index i on i.indexrelid = c.oid where not i.indisvalid")
        if [ -n "$$invalid" ]; then echo "INVALID indexes:"; echo "$$invalid"; exit 1; fi
        echo "Postgres suite green: partitioned shape present, no INVALID indexes"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  logs:
