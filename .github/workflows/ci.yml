name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Runners are pinned to ubuntu-24.04 rather than ubuntu-latest. ubuntu-latest
  # moves to Ubuntu 26 on 2026-10-19, which would swap glibc, libpq and the
  # system Postgres under every job at once -- the same class of silent
  # environment drift that put prefix search on a broken collation (§3.4) and let
  # a json gem bump break
  # the sprockets manifest reader while CI stayed green. Pinning makes the change
  # opt-in: move the pin deliberately, with the suite to check it against.

  # The suite, against the engine production runs. There is exactly one test
  # job now: SQLite was dropped as the dev/test engine (config/database.yml), so
  # the old split between a fast SQLite job and a Postgres job is gone.
  #
  # Why this one has to be Postgres is worth keeping, because it is the reason
  # the split existed at all: Event.insertStatement once emitted SQLite `?`
  # placeholders through exec_query, Postgres rejected them outright, and
  # production therefore could not insert a single event -- while every SQLite
  # job stayed green (RECOMMENDATIONS 3.2). events and events_words are
  # partitioned on Postgres and are not partitionable at all on SQLite, so a
  # SQLite suite also never exercised the shape production queries, and the
  # composite covering index on events_words is Postgres-only.
  #
  # Cucumber runs here too. The features drive the same ingest and dashboard
  # paths that broke in 3.2 and 3.4, both of which were Postgres-specific.
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dad
          POSTGRES_PASSWORD: dad
          POSTGRES_DB: dad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://dad:dad@127.0.0.1:5432/dad_test
      SECRET_KEY_BASE: not_a_secret_only_ci_boots

    steps:
      # Before ruby/setup-ruby: with bundler-cache the gem set is installed during
      # that step, so libpq headers have to already be present.
      - uses: actions/checkout@v4

      - name: Install database client headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      - name: Verify the lockfile is committed and consistent
        run: bundle install --frozen

      # Not plain `rake db:migrate`: that loads the committed db/schema.rb -- a
      # portable dump that cannot express PARTITION BY -- into an empty Postgres
      # database and skips db/migrate entirely, so anything the dump cannot
      # express would never be built and this job would test a schema production
      # does not have.
      - name: Prepare test database
        run: bundle exec rake db:migrate_from_scratch

      # The dump cannot express PARTITION BY, so this is the assertion that the
      # job is really testing the shape production runs.
      - name: Assert the Postgres-only schema shape was built
        run: |
          not_partitioned=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from pg_class where relname in ('events','events_words') and relkind <> 'p'")
          if [ "$not_partitioned" != "0" ]; then
            echo "events/events_words must be partitioned on Postgres ($not_partitioned are not)"
            exit 1
          fi

      # Both CONCURRENTLY migrations can leave an INVALID index behind if a build
      # fails (lock timeout, deadlock, cancelled statement): Postgres keeps the
      # husk, it still holds its name, and Rails' index_exists? reports it as
      # healthy because its query does not filter indisvalid. A husk is invisible
      # to the planner -- the index it replaces is simply never used -- so search
      # degrades to a seq scan with the whole suite green.
      #
      # AddPatternIndexToWords self-heals its own husk; this catches the class
      # across every index, including 20261013000002, which is already released
      # and so cannot be given the same guard in place.
      - name: Assert no index was left INVALID by a failed CONCURRENTLY build
        run: |
          invalid=$(psql "$DATABASE_URL" -tAc \
            "select c.relname from pg_class c join pg_index i on i.indexrelid = c.oid where not i.indisvalid")
          if [ -n "$invalid" ]; then
            echo "INVALID indexes present (a CONCURRENTLY build failed; drop and rebuild):"
            echo "$invalid"
            exit 1
          fi
          echo "no INVALID indexes"

      - name: Unit and controller tests
        run: bundle exec rake test

      # `rake test` excludes test/system by design (Rails sets
      # DEFAULT_TEST_EXCLUDE to test/{system,dummy,fixtures}/**), so the
      # browser-level suite needs its own task or it never runs in CI.
      - name: System tests
        run: bundle exec rake test:system

      # `rake cucumber:ok` runs cucumber in-process, where minitest's autorun
      # then parses cucumber's --profile flag and exits 1. Invoke the binary.
      - name: Cucumber features
        run: bundle exec cucumber


  assets:
    runs-on: ubuntu-24.04
    # Set at job level because every step here boots the app, and two of them set
    # RAILS_ENV=production. Production refuses to boot without the Active Record
    # encryption keys -- the same fail-closed rule as SECRET_KEY_BASE above, and
    # the same reasoning: a dummy value is fine here because these steps only
    # boot the app and never read or write a Windows credential. Rails derives the
    # actual keys from these passphrases, so they need no particular length.
    env:
      DAD_AR_ENCRYPTION_KEY: not_a_secret_only_ci_boots_key
      DAD_AR_ENCRYPTION_SALT: not_a_secret_only_ci_boots_salt
    steps:
      - uses: actions/checkout@v4

      - name: Install database client headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      # Precompile in production, not development. config.assets.js_compressor is
      # set only in config/environments/production.rb, so a development
      # precompile runs no compressor at all and a compressor that cannot parse
      # the bundle -- Uglifier 2.7 is UglifyJS 2.x, which aborts on the first
      # arrow function -- passed CI while breaking every deploy.
      #
      # DATABASE_URL points at a database that does not exist: precompiling only
      # boots the app, and the sprockets railtie needs a connection for nothing.
      # A real URL keeps the boot path identical to production's.
      - name: Precompile assets (production, with the JS compressor)
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: not_a_secret_only_ci_boots
          DATABASE_URL: postgres://dad:dad@127.0.0.1:5432/dad_missing
        run: bundle exec rake assets:precompile

      # The manifest now exists on disk; booting reads it. Fails loudly if the
      # json gem and sprockets disagree about JSON.parse keyword arguments.
      - name: Boot with a sprockets manifest present
        run: bundle exec rails runner 'puts "boot ok"'

      # Guards the `//= require jquery3` switch: jquery-rails still ships
      # 1.12.4 as jquery.js, so a silent revert to `require jquery` would
      # re-introduce CVE-2020-11023 / CVE-2020-23064 with everything else green.
      - name: Assert the built bundle ships jQuery 3
        run: |
          f=$(ls public/assets/application-*.js | head -1)
          grep -q "jQuery JavaScript Library v3" "$f" \
            || { echo "built bundle is not jQuery 3:"; grep -aoE "jQuery (JavaScript Library )?v[0-9.]+" "$f" | sort -u; exit 1; }
          grep -q "jQuery JavaScript Library v1\.12\.4" "$f" \
            && { echo "jQuery 1.12.4 present in bundle"; exit 1; }
          echo "built bundle ships jQuery 3"

      # The compressor runs, or the production precompile above is just a
      # concatenation. Uncompressed, application.js is ~918 KB over ~21,700
      # lines; Terser brings it to ~480 KB over a handful. Asserting on the
      # line count rather than the byte size avoids a false failure when a
      # dependency legitimately changes the payload.
      - name: Assert the built bundle was minified
        run: |
          f=$(ls public/assets/application-*.js | head -1)
          lines=$(wc -l < "$f")
          [ "$lines" -lt 200 ] \
            || { echo "bundle looks unminified: $lines lines ($(wc -c < "$f") bytes)"; exit 1; }
          echo "bundle minified: $lines lines, $(wc -c < "$f") bytes"

      # Both .js.coffee files and the dashboard's 60-second poll carried
      # `complete: $.ajax()`, which calls $.ajax() with no options while building
      # the options object. jQuery's ajaxSettings.url is document.location.href, so
      # each one fired a second XHR that re-rendered the current page as HTML.
      # Nothing else in the suite runs JavaScript, so the built bundle is the only
      # place this is visible.
      - name: Assert the bundle has no no-argument $.ajax() call
        run: |
          f=$(ls public/assets/application-*.js | head -1)
          if grep -qE '[A-Za-z_$]+\.ajax\(\s*\)' "$f"; then
            echo "bundle calls .ajax() with no options (re-fetches the current page):"
            grep -oE '.{40}[A-Za-z_$]+\.ajax\(\s*\).{20}' "$f"
            exit 1
          fi
          echo "no no-argument .ajax() in the bundle"

      # config.assets.compile = false means Apache, not Rails, serves every
      # asset. So every path the app emits has to exist on disk. This catches the
      # digest/compile coupling: with digest = false the helpers ask for
      # /assets/application.js, which precompile never writes, and the pages 404
      # in production while everything in the suite stays green.
      - name: Assert every emitted asset path exists on disk
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: not_a_secret_only_ci_boots
          DATABASE_URL: postgres://dad:dad@127.0.0.1:5432/dad_missing
        run: bundle exec ruby script/check_asset_paths.rb

  # Guards the systemd units, which no other job touches: the test suite never
  # loads them, so a syntax error reached master silently before. These are the
  # files that decide whether the importer survives a reboot, so they are worth
  # a gate.
  systemd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: systemd units parse
        run: |
          # systemd-analyze verify also checks that ExecStart targets exist, and
          # /usr/bin/bundle is a Debian path that does not exist on the runner.
          # Tolerate exactly that class of line; fail on anything structural
          # (unknown keys, bad sections, malformed values).
          out=$(systemd-analyze verify systemd/dad-*.service 2>&1 |
                grep -v 'is not executable' || true)
          if [ -n "$out" ]; then
            echo "systemd-analyze reported problems:"; echo "$out"; exit 1
          fi
          echo "systemd units parse cleanly"

  # Builds and boots the Docker stack. This job exists because nothing else in CI
  # ever builds the image, and an image that cannot build sat on master unnoticed:
  # the file then named Dockerfile.dev contained a bare `gem install bundler`
  # line, which is not a Dockerfile instruction, so `docker build` failed on it.
  # The suite could not have caught that -- test/assets/systemd all run on
  # runner-installed Ruby, and systemd only parses unit files.
  #
  # It also covers two failures that are invisible to every other job, because
  # GitHub's ubuntu-24.04 runners already have what the image lacked:
  #   - No JavaScript runtime. ExecJS is reached through the sprockets pipeline
  #     behind javascript_include_tag, so a ruby:* base image without nodejs
  #     raises "Could not find a JavaScript runtime" on *every* view render.
  #   - a Gemfile group that excluded pg would leave these containers unable to
  #     talk to Postgres, which is why `pg` is not in a group at all.
  # Neither is exercised by the postgres job, which uses runner Ruby and a
  # runner-installed Node rather than this image.
  #
  # Deliberately NOT a re-run of the suite: the postgres job already covers all
  # all tests on Postgres 18. What is unique here is the image and the compose
  # topology, so this asserts those -- boot, migrate, seed, render, serve assets.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Catches a broken docker-compose.yml before the build does, with a parse
      # error rather than a confusing failure three minutes later.
      - name: Compose file parses
        run: docker compose config >/dev/null

      # Every container except the collector must ship its own stdout/stderr to
      # the collector. Asserted against the *resolved* config with all profiles
      # enabled, so a profile-gated service cannot hide, and a new service that
      # forgets its `logging:` block fails here instead of quietly producing no
      # events forever.
      #
      # `syslog` is asserted in the opposite direction on purpose: it must NOT
      # forward. With DAD_SYSLOG_DEBUG=1 a forwarding collector echoes each
      # record it writes to stdout, the driver sends that straight back to the
      # same socket, and the staging file was measured growing 5.7GB -> 13.9GB
      # in 20 seconds (~411MB/s) until the container was killed.
      - name: Assert every container but the collector forwards its logs
        run: |
          docker compose --profile windows --profile test config > /tmp/resolved.yml
          python3 - <<'PY'
          import sys, yaml
          svcs = yaml.safe_load(open("/tmp/resolved.yml"))["services"]
          forward, exempt, bad = [], [], []
          for name in sorted(svcs):
              log = svcs[name].get("logging") or {}
              opt = log.get("options") or {}
              drv = log.get("driver")
              if name == "syslog":
                  if drv:
                      bad.append("syslog must NOT forward: self-feeding loop")
                  else:
                      exempt.append(name)
              elif drv != "syslog":
                  bad.append("%s: driver=%r, expected 'syslog'" % (name, drv))
              elif not str(opt.get("tag", "")).startswith("dad-"):
                  bad.append("%s: tag=%r, expected dad-*" % (name, opt.get("tag")))
              elif "127.0.0.1" not in opt.get("syslog-address", ""):
                  bad.append("%s: syslog-address=%r must be host loopback"
                             % (name, opt.get("syslog-address")))
              else:
                  forward.append(opt["tag"])
          if bad:
              print("FAIL")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("forwarding (%d): %s" % (len(forward), ", ".join(forward)))
          print("exempt (%d): %s" % (len(exempt), ", ".join(exempt)))
          PY

      # The database must be bind-mounted out of the checkout, not parked in a
      # named volume. A named volume is deleted by `down -v` and is keyed to the
      # Compose project name, so both an operator reaching for `-v` and someone
      # renaming the checkout lose the development database with no error
      # anywhere. Asserted against the resolved config, so it cannot be satisfied
      # by a volume declared but never mounted.
      - name: Assert the database is bind-mounted, not a named volume
        run: |
          docker compose config > /tmp/db.yml
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open("/tmp/db.yml"))
          vols = doc["services"]["db"].get("volumes") or []
          binds = [v for v in vols if v.get("type") == "bind"]
          named = [v for v in vols if v.get("type") == "volume"]
          if not binds:
              sys.exit("db has no bind mount: the database would live in a named "
                       "volume, which `down -v` deletes")
          if named:
              sys.exit("db still mounts named volume(s): %s"
                       % ", ".join(v.get("source", "?") for v in named))
          # /var/lib/postgresql, not .../data: the 18+ images keep each major in a
          # subdirectory and refuse to start if the old path is mounted.
          target = binds[0]["target"].rstrip("/")
          if target != "/var/lib/postgresql":
              sys.exit("db bind target is %r; the 18+ images need "
                       "/var/lib/postgresql" % target)
          if "pgdata" in (doc.get("volumes") or {}):
              sys.exit("top-level pgdata volume still declared")
          print("db bind-mounted: %s -> %s" % (binds[0]["source"], target))
          PY

      # The compose db image and the postgres job's service image must be the same
      # major. Nothing else forces them to move together, and a suite that passes
      # on one major while the stack runs another is exactly the silent
      # environment drift the rest of this file goes out of its way to prevent.
      - name: Assert CI and Compose agree on the PostgreSQL major
        run: |
          ci=$(grep -oE 'image: postgres:[0-9]+' .github/workflows/ci.yml | head -1 | grep -oE '[0-9]+$')
          compose=$(docker compose config | sed -n '/^  db:/,/^  [a-z]/p' | grep -oE 'image: postgres:[0-9]+' | head -1 | grep -oE '[0-9]+$')
          if [ -z "$ci" ] || [ -z "$compose" ]; then
            echo "could not read both majors (ci=$ci compose=$compose)"; exit 1
          fi
          if [ "$ci" != "$compose" ]; then
            echo "PostgreSQL major mismatch: CI tests $ci, the stack runs $compose"
            exit 1
          fi
          echo "both on PostgreSQL $ci"

      # No layer caching: it needs buildx plus two third-party actions, and this
      # repo pins and checksums the one external binary it does fetch. The build
      # is a few minutes of native gem compilation, which is affordable for one
      # job and keeps the dependency surface at zero.
      - name: Build the image
        run: docker compose build

      - name: Boot the stack
        run: |
          docker compose up -d
          # web has no healthcheck, so poll rather than trusting container state.
          # Accept any HTTP status, including 500: this step's job is to know that
          # Rails finished booting, not that the app is healthy. A render failure
          # (no JS runtime, missing asset) must reach the render step below, which
          # names the cause; `curl -f` here would time out and report only that the
          # URL never succeeded.
          for _ in $(seq 1 60); do
            # `|| code=000` is load-bearing. While Rails is still binding, the
            # first request can be reset rather than refused, and curl then exits
            # non-zero with no output. The assignment would carry that status and
            # `bash -e` would abort the step -- which is what happened on the
            # runner: the stack was healthy, the poll just died on attempt one.
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              http://127.0.0.1:3000/users/logon 2>/dev/null) || code=000
            if [ "$code" != "000" ]; then
              echo "web listening (HTTP $code)"; exit 0
            fi
            sleep 2
          done
          echo "web never accepted a request"
          docker compose logs web
          exit 1

      # Asserts effects, not container exit codes: `docker compose ps --format`
      # field names vary across Compose versions, and an empty database is the
      # real symptom of a failed migrate anyway.
      #
      # Partitioned shape here is the same assertion the postgres job makes, but
      # reached through the compose migrate service, which is what an operator
      # actually runs. That service uses db:migrate_from_scratch on an empty
      # database on purpose: plain db:migrate loads the committed SQLite-flavoured
      # schema.rb into an empty Postgres database and skips db/migrate entirely.
      - name: Assert the database was migrated and seeded
        run: |
          q() { docker compose exec -T db psql -U dad -d dad_development -tAc "$1"; }
          [ "$(q "select count(*) from pg_class where relname in ('events','events_words') and relkind <> 'p'")" = "0" ] \
            || { echo "events/events_words must be partitioned on Postgres"; exit 1; }
          [ "$(q "select count(*) from users")" -gt 0 ] \
            || { echo "no users: the stack boots but the login form can never succeed"; exit 1; }
          echo "migrated (partitioned) and seeded"

      # The ExecJS gate. A view render is what fails without a JS runtime, so
      # booting is not enough -- the response has to be a rendered page.
      - name: Assert views render and assets are served
        run: |
          # Read the body and the status separately rather than using curl -f:
          # a missing JS runtime surfaces as a 500 whose body names the cause, and
          # -f would discard that body and report only "returned error: 500".
          jar=$(mktemp)
          # `|| page=""` keeps a failed request from aborting the step before the
          # diagnostic below can say what actually went wrong.
          page=$(curl -s --max-time 20 -c "$jar" http://127.0.0.1:3000/users/logon 2>/dev/null) || page="" 
          if echo "$page" | grep -q "Could not find a JavaScript runtime"; then
            echo "image has no JavaScript runtime for ExecJS: the sprockets pipeline"
            echo "behind javascript_include_tag calls ExecJS, so every view render 500s."
            echo "Install a runtime in the Dockerfile (nodejs)."
            exit 1
          fi
          echo "$page" | grep -q "authenticity_token" \
            || { echo "login form did not render"; exit 1; }

          # Sign in for real: an unauthenticated request would not exercise the
          # session lookup or the authenticated layout.
          token=$(echo "$page" | sed -n 's/.*name="authenticity_token" value="\([^"]*\)".*/\1/p' | head -1)
          curl -fsS -b "$jar" -c "$jar" -o /dev/null \
            --data-urlencode "authenticity_token=$token" \
            --data-urlencode "user[username]=admin" \
            --data-urlencode "user[password]=dad_dev_password" \
            http://127.0.0.1:3000/users/do_logon
          curl -fsS -b "$jar" -o /dev/null http://127.0.0.1:3000/events
          echo "authenticated dashboard renders"

          # config.public_file_server.enabled is false in production because
          # Apache serves assets; the stack runs development, so Rails must.
          asset=$(echo "$page" | grep -oE '/assets/[A-Za-z0-9._-]+\.(css|js)' | head -1)
          [ -n "$asset" ] || { echo "page emitted no asset path"; exit 1; }
          code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$asset" 2>/dev/null) || code=000
          [ "$code" = "200" ] || { echo "$asset returned $code"; exit 1; }
          echo "asset served: $asset"

      # The collector is a standalone Rust binary and touches no database, so no
      # Ruby-level job would notice it failing to start. The `collector` job runs
      # its unit/integration tests; this is the end-to-end leg through the importer.
      - name: Assert the syslog collector is listening
        run: |
          docker compose ps syslog | grep -q "Up" \
            || { echo "syslog container not up"; docker compose logs syslog; exit 1; }
          # The line has to carry a syslog timestamp: EventIngestor parses one
          # off the front, and an unparseable line is counted as a failure rather
          # than stored, so a bare probe would prove only that UDP is open.
          # Rotation is traffic-driven -- ensure_open runs from the per-message
          # path -- so the second packet, sent after the 60s boundary, is what
          # moves the staging file into LogsToProcess for the importer to claim.
          # One packet alone would sit in LogStaging until later traffic arrives.
          send() {
            python3 -c "
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          line = '<34>%s cihost sshd[1]: probe-from-ci from 192.0.2.7 port 22 ssh2' % time.strftime('%b %e %H:%M:%S')
          s.sendto(line.encode(), ('127.0.0.1', 514))
          "
          }
          send; sleep 65; send

          # Poll rather than sleep a fixed amount. The importer scans
          # LogsToProcess once per minute (sleep 1.minute), so the delay from
          # packet to row is 0-60s plus rotation's own 60s boundary; a fixed
          # sleep would need ~150s and still race on a loaded runner.
          found=0
          for _ in $(seq 1 40); do
            found=$(docker compose exec -T db psql -U dad -d dad_development -tAc \
              "select count(*) from events where hunks like '%probe-from-ci%'" 2>/dev/null) \
              || found=0
            if [ "${found:-0}" -gt 0 ]; then break; fi
            sleep 5
          done
          [ "$found" -gt 0 ] \
            || { echo "UDP packet never reached the database"; docker compose logs syslog importer; exit 1; }
          echo "ingest path live: collector -> LogsToProcess -> importer -> Postgres ($found events)"

      # The stack's own logs. docker-compose.yml ships every service's stdout to
      # the collector, which only works if the frame the Docker log driver emits
      # is one EventIngestor can parse *and* the tag lands in the Service slot.
      # Neither is checked by any unit test, and both fail silently: a format
      # change makes every line a timestamp parse failure, so the queue fills,
      # nothing is stored, and every other step stays green.
      #
      # Asserting the Service name rather than just a row count is the point --
      # a row with the wrong Service means the driver started inserting a hostname
      # field ahead of the tag.
      - name: Assert the stack's own logs reach the database
        run: |
          q() { docker compose exec -T db psql -U dad -d dad_development -tAc "$1"; }
          # web, db and importer all boot in this job, so all three tags must show
          # up. Rotation is 60s and the importer scans once a minute, so allow the
          # same generous window the other ingest steps use.
          found=0
          for _ in $(seq 1 24); do
            found=$(q "select count(distinct s.name) from services s
                        join events e on e.service_id = s.id
                        where s.name in ('dad-web','dad-db','dad-importer')") || found=0
            if [ "${found:-0}" -ge 3 ]; then break; fi
            sleep 5
          done
          if [ "${found:-0}" -lt 3 ]; then
            echo "expected container logs from dad-web, dad-db and dad-importer; got $found service(s)"
            echo "staging:"; docker compose exec -T syslog ls -l /var/DAD/Logs/LogStaging /var/DAD/Logs/LogsToProcess
            docker compose logs syslog importer
            exit 1
          fi
          echo "self-logging live: container stdout -> collector -> importer -> Postgres ($found services)"

      # The Windows leg. Nothing else in CI boots the `windows` profile, so a
      # compose service that cannot start, or a forwarder that cannot find its
      # input, would ship unnoticed -- the same class of gap the syslog leg
      # exists for.
      #
      # Deliberately not a re-run of the converter's unit tests: those cover the
      # parsing. What is unique here is that the service starts, finds a real
      # file on a real volume, and its output survives the queue and the
      # importer into Postgres.
      - name: Assert the Windows forwarder reaches the database
        run: |
          docker compose --profile windows up -d windows
          # The fixture is a real OpenWEC Json record, not a synthetic line, so
          # this also re-checks the format contract against a file on disk. The
          # query keys on record=114689, that fixture's EventRecordID -- unique
          # enough to identify one event without editing the fixture to carry a
          # probe marker, which would make it stop looking like upstream output.
          docker compose exec -T windows mkdir -p /var/DAD/Logs/Windows
          docker compose cp test/fixtures/windows_events/security_4688.json \
            windows:/var/DAD/Logs/Windows/openwec.log

          # Two polls in series: the forwarder scans its input every
          # WINDOWS_POLL_INTERVAL (10s), then dad-importer scans LogsToProcess
          # once a minute. Poll rather than sleep a fixed amount.
          found=0
          for _ in $(seq 1 40); do
            found=$(docker compose exec -T db psql -U dad -d dad_development -tAc \
              "select count(*) from events where hunks like '%record=114689%'" 2>/dev/null) \
              || found=0
            if [ "${found:-0}" -gt 0 ]; then break; fi
            sleep 5
          done
          if [ "${found:-0}" -eq 0 ]; then
            echo "Windows event never reached the database"
            docker compose logs windows importer
            exit 1
          fi

          # The point of the whole path: the event has to land on the host it
          # came from, not just anywhere. A System row is what the timeline,
          # the host drill-down and the exclusions all key on.
          host=$(docker compose exec -T db psql -U dad -d dad_development -tAc \
            "select s.address from events e join systems s on s.id = e.system_id
             where e.hunks like '%record=114689%' limit 1")
          [ "$host" = "win10.windomain.local" ] \
            || { echo "Windows event landed on system '$host', expected win10.windomain.local"; exit 1; }
          echo "Windows ingest path live: OpenWEC file -> LogsToProcess -> importer -> Postgres ($found events, host $host)"

      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

  # The syslog collector is Rust, so it needs its own job: no other job compiles
  # it, and the docker job only builds it as a side effect of building the image,
  # which would not run its tests.
  #
  # Pinned to the same minor as the rust: tag in Dockerfile and the rustc/cargo
  # CI builds, so the image and the tested source build the
  # collector the same way.
  collector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - name: Formatting is checked in
        run: cargo fmt --all -- --check
        working-directory: syslog_collector
      # Lint is a gate, not advisory: the collector is network-facing and
      # long-lived. Default clippy lint set only -- `clippy::pedantic` reports
      # 13 style findings here that are not worth the churn.
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: syslog_collector
      - name: Unit and integration tests
        # The integration tests spawn the real binary on high UDP ports and
        # compare bytes on disk, so they need no root and no Postgres.
        run: cargo test
        working-directory: syslog_collector
      # The profile production and the Docker image actually build, so a
      # release-only compile error is caught here rather than at deploy time.
      - name: Release build
        run: cargo build --release
        working-directory: syslog_collector

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      # Both gates are now blocking. They were advisory because Rails 7.1 was
      # EOL with unfixable framework CVEs; Rails is now on a supported line and
      # the last four advisories have been cleared (httparty removed as an unused
      # dependency, jquery-rails bumped plus `//= require jquery3` to actually
      # ship jQuery >= 3.5). Brakeman reports 0 warnings, so no ignore file is
      # needed. A new advisory or a new sink now fails the build.
      - name: Dependency vulnerabilities
        run: bundle exec bundle-audit check --update

      - name: Static analysis
        run: bundle exec brakeman -q --no-pager -o brakeman-report.txt

      # Secret scanning. Blocking, like the two gates above.
      #
      # Scans the working tree, not history. A full-history scan finds six
      # secrets (the production key at de2043a plus the dev/test values at
      # 3f533757 and cd49a6ab); those are burned and documented in
      # RECOMMENDATIONS 1.1, and rewriting shared history in a public repo with
      # forks does not un-leak them. This gate exists to stop the next one.
      #
      # The binary is pinned and fetched directly rather than using
      # gitleaks/gitleaks-action, which needs a GITLEAKS_LICENSE for
      # organisations. .gitleaks.toml adds a rule for the specific failure that
      # happened here: the built-in rules do not flag a committed
      # `secret_key_base` written as an ENV fallback.
      - name: Secret scanning
        run: |
          GITLEAKS_VERSION=v8.30.1
          curl -sSfL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "$GITLEAKS_SUM" /tmp/gl.tar.gz | sha256sum -c -
          tar xzf /tmp/gl.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact
        env:
          # From the release's own gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SUM: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: brakeman-report.txt
