name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Runners are pinned to ubuntu-24.04 rather than ubuntu-latest. ubuntu-latest
  # moves to Ubuntu 26 on 2026-10-19, which would swap glibc, libpq and sqlite3
  # under every job at once -- the same class of silent environment drift that
  # put prefix search on a broken collation (§3.4) and let a json gem bump break
  # the sprockets manifest reader while CI stayed green. Pinning makes the change
  # opt-in: move the pin deliberately, with the suite to check it against.
  test:
    runs-on: ubuntu-24.04
    env:
      # pg is production-only and needs libpq-dev; the test suite uses sqlite3.
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      - name: Install sqlite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Verify the lockfile is committed and consistent
        run: bundle install --frozen

      - name: Prepare test database
        run: bundle exec rake db:migrate RAILS_ENV=test

      - name: Unit and controller tests
        run: bundle exec rake test

      # `rake cucumber:ok` runs cucumber in-process, where minitest's autorun
      # then parses cucumber's --profile flag and exits 1. Invoke the binary.
      - name: Cucumber features
        run: bundle exec cucumber

  # The same suite against the engine production actually runs.
  #
  # This job exists because the SQLite-only suite cannot see adapter-specific SQL
  # breakage, and one instance was total: Event.insertStatement emitted SQLite `?`
  # placeholders through exec_query, Postgres rejected them outright, and
  # production therefore could not insert a single event -- while every job above
  # stayed green. Nothing else in CI touches Postgres, because pg sits in the
  # :production group and every other job sets BUNDLE_WITHOUT=production.
  #
  # Cucumber runs here as well as on SQLite. The features drive the same ingest
  # and dashboard paths that broke in 3.2 and 3.4, both of which were
  # Postgres-specific, so leaving the feature layer on SQLite left the
  # partitioned path covered only by unit tests. RAILS_ENV stays `test` (what
  # cucumber-rails defaults to anyway), so DATABASE_URL selects the engine for
  # both suites and the `cucumber:` entry in database.yml is not consulted.
  postgres:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dad
          POSTGRES_PASSWORD: dad
          POSTGRES_DB: dad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # pg lives in the :production group, so this job must not exclude it.
      BUNDLE_WITHOUT: ""
      RAILS_ENV: test
      DATABASE_URL: postgres://dad:dad@127.0.0.1:5432/dad_test
      SECRET_KEY_BASE: not_a_secret_only_ci_boots

    steps:
      # Before ruby/setup-ruby: with bundler-cache the gem set is installed during
      # that step, so libpq headers have to already be present.
      - uses: actions/checkout@v4

      - name: Install database client headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsqlite3-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      - name: Verify the lockfile is committed and consistent
        run: bundle install --frozen

      # Not plain `rake db:migrate`: that loads the committed SQLite-flavoured
      # db/schema.rb into an empty Postgres database and skips db/migrate entirely,
      # so anything the dump cannot express (partitioned events) would never be
      # built and this job would test a schema production does not have.
      - name: Prepare test database
        run: bundle exec rake db:migrate_from_scratch

      # The dump cannot express PARTITION BY, so this is the assertion that the
      # Postgres job is really testing the shape production runs.
      - name: Assert the Postgres-only schema shape was built
        run: |
          not_partitioned=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from pg_class where relname in ('events','events_words') and relkind <> 'p'")
          if [ "$not_partitioned" != "0" ]; then
            echo "events/events_words must be partitioned on Postgres ($not_partitioned are not)"
            exit 1
          fi

      # Both CONCURRENTLY migrations can leave an INVALID index behind if a build
      # fails (lock timeout, deadlock, cancelled statement): Postgres keeps the
      # husk, it still holds its name, and Rails' index_exists? reports it as
      # healthy because its query does not filter indisvalid. A husk is invisible
      # to the planner -- the index it replaces is simply never used -- so search
      # degrades to a seq scan with the whole suite green.
      #
      # AddPatternIndexToWords self-heals its own husk; this catches the class
      # across every index, including 20261013000002, which is already released
      # and so cannot be given the same guard in place.
      - name: Assert no index was left INVALID by a failed CONCURRENTLY build
        run: |
          invalid=$(psql "$DATABASE_URL" -tAc \
            "select c.relname from pg_class c join pg_index i on i.indexrelid = c.oid where not i.indisvalid")
          if [ -n "$invalid" ]; then
            echo "INVALID indexes present (a CONCURRENTLY build failed; drop and rebuild):"
            echo "$invalid"
            exit 1
          fi
          echo "no INVALID indexes"

      - name: Unit and controller tests on Postgres
        run: bundle exec rake test

      # Same in-process caveat as the SQLite job: rake cucumber:ok loads
      # minitest's autorun, which then parses cucumber's own flags.
      - name: Cucumber features on Postgres
        run: bundle exec cucumber

  # Asset pipeline + boot-with-manifest. This job exists because the test suite
  # never touches the sprockets manifest: `rake test` boots with no
  # public/assets, so the manifest *reader* is never exercised. That is how a
  # json 3.x bump (which removed the create_additions keyword sprockets'
  # manifest reader passes) reached master while CI stayed green. A fresh CI
  # checkout has no manifest, so precompile-then-boot is the only way to cover
  # it -- and it is the production path, not a dev one.
  assets:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      - name: Install sqlite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Precompile in production, not development. config.assets.js_compressor is
      # set only in config/environments/production.rb, so a development
      # precompile runs no compressor at all and a compressor that cannot parse
      # the bundle -- Uglifier 2.7 is UglifyJS 2.x, which aborts on the first
      # arrow function -- passed CI while breaking every deploy.
      #
      # BUNDLE_WITHOUT: production still applies, so pg is absent; DATABASE_URL
      # points at sqlite, which takes precedence over the postgresql adapter
      # entry in database.yml. Nothing here touches the database beyond booting.
      - name: Precompile assets (production, with the JS compressor)
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: not_a_secret_only_ci_boots
          DATABASE_URL: sqlite3:db/ci_assets.sqlite3
        run: bundle exec rake assets:precompile

      # The manifest now exists on disk; booting reads it. Fails loudly if the
      # json gem and sprockets disagree about JSON.parse keyword arguments.
      - name: Boot with a sprockets manifest present
        run: bundle exec rails runner 'puts "boot ok"'

      # Guards the `//= require jquery3` switch: jquery-rails still ships
      # 1.12.4 as jquery.js, so a silent revert to `require jquery` would
      # re-introduce CVE-2020-11023 / CVE-2020-23064 with everything else green.
      - name: Assert the built bundle ships jQuery 3
        run: |
          f=$(ls public/assets/application-*.js | head -1)
          grep -q "jQuery JavaScript Library v3" "$f" \
            || { echo "built bundle is not jQuery 3:"; grep -aoE "jQuery (JavaScript Library )?v[0-9.]+" "$f" | sort -u; exit 1; }
          grep -q "jQuery JavaScript Library v1\.12\.4" "$f" \
            && { echo "jQuery 1.12.4 present in bundle"; exit 1; }
          echo "built bundle ships jQuery 3"

      # The compressor runs, or the production precompile above is just a
      # concatenation. Uncompressed, application.js is ~918 KB over ~21,700
      # lines; Terser brings it to ~480 KB over a handful. Asserting on the
      # line count rather than the byte size avoids a false failure when a
      # dependency legitimately changes the payload.
      - name: Assert the built bundle was minified
        run: |
          f=$(ls public/assets/application-*.js | head -1)
          lines=$(wc -l < "$f")
          [ "$lines" -lt 200 ] \
            || { echo "bundle looks unminified: $lines lines ($(wc -c < "$f") bytes)"; exit 1; }
          echo "bundle minified: $lines lines, $(wc -c < "$f") bytes"

      # config.assets.compile = false means Apache, not Rails, serves every
      # asset. So every path the app emits has to exist on disk. This catches the
      # digest/compile coupling: with digest = false the helpers ask for
      # /assets/application.js, which precompile never writes, and the pages 404
      # in production while everything in the suite stays green.
      - name: Assert every emitted asset path exists on disk
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: not_a_secret_only_ci_boots
          DATABASE_URL: sqlite3:db/ci_assets.sqlite3
        run: bundle exec ruby script/check_asset_paths.rb

  # Guards the provisioning artifacts, which no other job touches: the test
  # suite never loads provision.sh or the systemd units, so a syntax error in
  # either reached master silently before. These are the files that decide
  # whether the importer survives a reboot, so they are worth a gate.
  provisioning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: provision.sh parses
        run: bash -n provision.sh

      - name: systemd units parse
        run: |
          # systemd-analyze verify also checks that ExecStart targets exist, and
          # /usr/bin/bundle is a Debian path that does not exist on the runner.
          # Tolerate exactly that class of line; fail on anything structural
          # (unknown keys, bad sections, malformed values).
          out=$(systemd-analyze verify systemd/dad-*.service 2>&1 |
                grep -v 'is not executable' || true)
          if [ -n "$out" ]; then
            echo "systemd-analyze reported problems:"; echo "$out"; exit 1
          fi
          echo "systemd units parse cleanly"

  # Builds and boots the Docker stack. This job exists because nothing else in CI
  # ever builds the image, and an image that cannot build sat on master unnoticed:
  # the file then named Dockerfile.dev contained a bare `gem install bundler`
  # line, which is not a Dockerfile instruction, so `docker build` failed on it.
  # The suite could not have caught that -- test/postgres/assets/provisioning all
  # run on runner-installed Ruby, and provisioning only parses provision.sh and
  # the systemd units.
  #
  # It also covers two failures that are invisible to every other job, because
  # GitHub's ubuntu-24.04 runners already have what the image lacked:
  #   - No JavaScript runtime. ExecJS is reached through the sprockets pipeline
  #     behind javascript_include_tag, so a ruby:* base image without nodejs
  #     raises "Could not find a JavaScript runtime" on *every* view render.
  #   - BUNDLE_WITHOUT=production would drop pg, which sits in the Gemfile's
  #     :production group while these containers talk to Postgres.
  # Neither is exercised by the postgres job, which uses runner Ruby and a
  # runner-installed Node rather than this image.
  #
  # Deliberately NOT a re-run of the suite: the postgres job already covers all
  # 436 tests on Postgres 17. What is unique here is the image and the compose
  # topology, so this asserts those -- boot, migrate, seed, render, serve assets.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Catches a broken docker-compose.yml before the build does, with a parse
      # error rather than a confusing failure three minutes later.
      - name: Compose file parses
        run: docker compose config >/dev/null

      # No layer caching: it needs buildx plus two third-party actions, and this
      # repo pins and checksums the one external binary it does fetch. The build
      # is a few minutes of native gem compilation, which is affordable for one
      # job and keeps the dependency surface at zero.
      - name: Build the image
        run: docker compose build

      - name: Boot the stack
        run: |
          docker compose up -d
          # web has no healthcheck, so poll rather than trusting container state.
          # Accept any HTTP status, including 500: this step's job is to know that
          # Rails finished booting, not that the app is healthy. A render failure
          # (no JS runtime, missing asset) must reach the render step below, which
          # names the cause; `curl -f` here would time out and report only that the
          # URL never succeeded.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/users/logon)
            if [ "$code" != "000" ]; then
              echo "web listening (HTTP $code)"; exit 0
            fi
            sleep 2
          done
          echo "web never accepted a request"
          exit 1

      # Asserts effects, not container exit codes: `docker compose ps --format`
      # field names vary across Compose versions, and an empty database is the
      # real symptom of a failed migrate anyway.
      #
      # Partitioned shape here is the same assertion the postgres job makes, but
      # reached through the compose migrate service, which is what an operator
      # actually runs. That service uses db:migrate_from_scratch on an empty
      # database on purpose: plain db:migrate loads the committed SQLite-flavoured
      # schema.rb into an empty Postgres database and skips db/migrate entirely.
      - name: Assert the database was migrated and seeded
        run: |
          q() { docker compose exec -T db psql -U dad -d dad_development -tAc "$1"; }
          [ "$(q "select count(*) from pg_class where relname in ('events','events_words') and relkind <> 'p'")" = "0" ] \
            || { echo "events/events_words must be partitioned on Postgres"; exit 1; }
          [ "$(q "select count(*) from users")" -gt 0 ] \
            || { echo "no users: the stack boots but the login form can never succeed"; exit 1; }
          echo "migrated (partitioned) and seeded"

      # The ExecJS gate. A view render is what fails without a JS runtime, so
      # booting is not enough -- the response has to be a rendered page.
      - name: Assert views render and assets are served
        run: |
          # Read the body and the status separately rather than using curl -f:
          # a missing JS runtime surfaces as a 500 whose body names the cause, and
          # -f would discard that body and report only "returned error: 500".
          jar=$(mktemp)
          page=$(curl -s -c "$jar" http://127.0.0.1:3000/users/logon)
          if echo "$page" | grep -q "Could not find a JavaScript runtime"; then
            echo "image has no JavaScript runtime for ExecJS: the sprockets pipeline"
            echo "behind javascript_include_tag calls ExecJS, so every view render 500s."
            echo "Install a runtime in the Dockerfile (nodejs)."
            exit 1
          fi
          echo "$page" | grep -q "authenticity_token" \
            || { echo "login form did not render"; exit 1; }

          # Sign in for real: an unauthenticated request would not exercise the
          # session lookup or the authenticated layout.
          token=$(echo "$page" | sed -n 's/.*name="authenticity_token" value="\([^"]*\)".*/\1/p' | head -1)
          curl -fsS -b "$jar" -c "$jar" -o /dev/null \
            --data-urlencode "authenticity_token=$token" \
            --data-urlencode "user[username]=admin" \
            --data-urlencode "user[password]=dad_dev_password" \
            http://127.0.0.1:3000/users/do_logon
          curl -fsS -b "$jar" -o /dev/null http://127.0.0.1:3000/events
          echo "authenticated dashboard renders"

          # config.public_file_server.enabled is false in production because
          # Apache serves assets; the stack runs development, so Rails must.
          asset=$(echo "$page" | grep -oE '/assets/[A-Za-z0-9._-]+\.(css|js)' | head -1)
          [ -n "$asset" ] || { echo "page emitted no asset path"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$asset")
          [ "$code" = "200" ] || { echo "$asset returned $code"; exit 1; }
          echo "asset served: $asset"

      # The collector is Perl and touches no database, so no other job would
      # notice it failing to start.
      - name: Assert the syslog collector is listening
        run: |
          docker compose ps syslog | grep -q "Up" \
            || { echo "syslog container not up"; docker compose logs syslog; exit 1; }
          # The line has to carry a syslog timestamp: EventIngestor parses one
          # off the front, and an unparseable line is counted as a failure rather
          # than stored, so a bare probe would prove only that UDP is open.
          # Rotation is traffic-driven too -- RotateLog runs from logit -- so the
          # second packet, sent after the 60s boundary, is what moves the staging
          # file into LogsToProcess for the importer to claim.
          send() {
            python3 -c "
          import socket, sys, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          line = '<34>%s cihost sshd[1]: probe-from-ci from 192.0.2.7 port 22 ssh2' % time.strftime('%b %e %H:%M:%S')
          s.sendto(line.encode(), ('127.0.0.1', 514))
          "
          }
          send; sleep 65; send

          # Poll rather than sleep a fixed amount. The importer scans
          # LogsToProcess once per minute (sleep 1.minute), so the delay from
          # packet to row is 0-60s plus rotation's own 60s boundary; a fixed
          # sleep would need ~150s and still race on a loaded runner.
          found=0
          for _ in $(seq 1 40); do
            found=$(docker compose exec -T db psql -U dad -d dad_development -tAc \
              "select count(*) from events where hunks like '%probe-from-ci%'")
            [ "$found" -gt 0 ] && break
            sleep 5
          done
          [ "$found" -gt 0 ] \
            || { echo "UDP packet never reached the database"; docker compose logs syslog importer; exit 1; }
          echo "ingest path live: collector -> LogsToProcess -> importer -> Postgres ($found events)"

      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

  security:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.8'
          bundler-cache: true

      # Both gates are now blocking. They were advisory because Rails 7.1 was
      # EOL with unfixable framework CVEs; Rails is now on a supported line and
      # the last four advisories have been cleared (httparty removed as an unused
      # dependency, jquery-rails bumped plus `//= require jquery3` to actually
      # ship jQuery >= 3.5). Brakeman reports 0 warnings, so no ignore file is
      # needed. A new advisory or a new sink now fails the build.
      - name: Dependency vulnerabilities
        run: bundle exec bundle-audit check --update

      - name: Static analysis
        run: bundle exec brakeman -q --no-pager -o brakeman-report.txt

      # Secret scanning. Blocking, like the two gates above.
      #
      # Scans the working tree, not history. A full-history scan finds six
      # secrets (the production key at de2043a plus the dev/test values at
      # 3f533757 and cd49a6ab); those are burned and documented in
      # RECOMMENDATIONS 1.1, and rewriting shared history in a public repo with
      # forks does not un-leak them. This gate exists to stop the next one.
      #
      # The binary is pinned and fetched directly rather than using
      # gitleaks/gitleaks-action, which needs a GITLEAKS_LICENSE for
      # organisations. .gitleaks.toml adds a rule for the specific failure that
      # happened here: the built-in rules do not flag a committed
      # `secret_key_base` written as an ENV fallback.
      - name: Secret scanning
        run: |
          GITLEAKS_VERSION=v8.30.1
          curl -sSfL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "$GITLEAKS_SUM" /tmp/gl.tar.gz | sha256sum -c -
          tar xzf /tmp/gl.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact
        env:
          # From the release's own gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SUM: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: brakeman-report.txt
