# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
development:
  adapter: sqlite3
  database: db/development.sqlite3
  pool: 5
  timeout: 5000

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test: &test
    adapter: sqlite3
    database: db/test.sqlite3
    pool: 5
    timeout: 5000

# Production credentials come from the environment, never from this file.
# Set DATABASE_URL (preferred), e.g.
#   postgres://rails:<password>@127.0.0.1/events_prod
# or the individual DAD_DB_* variables. provision.sh writes these to
# /etc/DAD/environment; the individual variables exist so an operator can point
# at a cluster without hand-writing a URL.
production:
  adapter: postgresql
  encoding: utf8
  database: <%= ENV["DAD_DB_NAME"] || "events_prod" %>
  username: <%= ENV["DAD_DB_USER"] %>
  password: <%= ENV["DAD_DB_PASSWORD"] %>
  host: <%= ENV["DAD_DB_HOST"] || "127.0.0.1" %>
  pool: 5
  timeout: 5000

cucumber:
  <<: *test