# Production secret_key_base, read from the environment (Rails 4.2 convention).
#
# Only the production entry remains. Rails 7.1 deprecates supplying
# secret_key_base through Rails.application.secrets (removed in 7.2), so the
# development and test values that used to live here moved to
# config/environments/{development,test}.rb as config.secret_key_base.
#
# Production has no committed value on purpose: it is read from SECRET_KEY_BASE
# at boot (see provision.sh, which generates one into /etc/DAD/environment).
# Leaving it unset makes Rails refuse to boot rather than fall back to a
# committed value -- see config/initializers/require_secrets.rb.
#
# The dev/test values that were here were rotated on 2026-10-14. The originals
# sat in git history from the first commit, so treat them as burned: any host
# that still uses one of them must generate its own.

production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
