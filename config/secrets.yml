# Application secrets, per environment (Rails 4.2 convention).
#
# This file is tracked on purpose: it contains no production secret. The
# production value is read from the environment at boot, so nothing sensitive is
# committed. The development/test values below are not secrets -- they sign
# cookies on a developer's own machine -- and committing them keeps
# `rake test`/`cucumber` working with no setup.
#
# The values below were rotated on 2026-10-14. The originals sat in git history
# from the first commit, so treat them as burned: any host that still uses one
# of them must generate its own. Rotate again if the repo is ever forked into a
# less-trusted place.
#
# Production requires SECRET_KEY_BASE to be set (see provision.sh, which
# generates one into /etc/DAD/environment). Leaving it unset makes Rails refuse
# to boot rather than fall back to a committed value.

development:
  secret_key_base: 7a9d9a89be64f8d24bda2dd4199b44c67911ffa0b5967cf9fe3fe9185c2d1279

test:
  secret_key_base: 26dc4b4ea181d7e5850533b057b6c0399d5058f1c905c105c9322eb9d00b1d31

production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
